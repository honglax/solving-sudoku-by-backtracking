body{margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:36px;padding:0 12px;border-radius:6px;border:1px solid transparent;font:500 14px/20px 'Be Vietnam Pro',system-ui,sans-serif;white-space:nowrap;cursor:pointer;text-decoration:none;transition:background-color 150ms ease-out}

.r .btn-s{background:var(--surface);color:var(--text);border-color:var(--cell-line)}

.r .btn-g{background:transparent;color:var(--text)}

.tb-right{display:flex;align-items:center;gap:12px}
.tdiv{width:1px;height:20px;background:var(--border);flex:none}
.theme-sw{display:flex;align-items:center;flex:none;height:36px;border:1px solid var(--cell-line);border-radius:6px;overflow:hidden}
.r .theme-sw button{display:inline-flex;align-items:center;gap:4px;width:36px;height:34px;justify-content:center;padding:0;border:0;border-radius:0;background:transparent;color:var(--text);font:500 14px/20px 'Be Vietnam Pro',system-ui,sans-serif;cursor:pointer;transition:background-color 150ms ease-out}
.r .theme-sw button:hover{background:var(--sunken)}
.r .theme-sw button + button{border-left:1px solid var(--cell-line)}
.r .theme-sw button{color:var(--muted)}
.r .theme-sw button[aria-pressed="true"]{background:var(--sunken);color:var(--text)}
.r .theme-sw button[aria-pressed="true"] svg{stroke-width:2.25}
@media (max-width: 767px){.theme-sw,.tdiv{display:none}}
@media (prefers-reduced-motion: reduce){.r .theme-sw button{transition:none}}

@media (prefers-reduced-motion: reduce){.btn{transition:none}}

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Chế độ"},"$preview":{"width":1440,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // Mặc định theo hệ thống (ở canvas: Tweak "dark"); bấm Sáng/Tối thì ghi đè.
    var self = this;
    var dark = (this.state && this.state.dark !== undefined) ? this.state.dark : (this.props.dark ?? false);
    return { theme: dark ? 'dark' : 'light', isLight: !dark, isDark: dark, toLight: function () { self.setState({ dark: false }); }, toDark: function () { self.setState({ dark: true }); } };
  }
}
